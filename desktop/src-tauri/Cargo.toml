[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon" enables the system tray API used in lib.rs (Week 4: basic
# shell = window + tray + a connect/disconnect stub).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Week 5: desktop's real `vpn_core::state::DeviceState` implementation.
vpn_core = { path = "../../core" }
sysinfo = "0.33"

# Week 8: the client's WireGuard identity for the handshake (same versions
# core already uses, so nothing new is compiled).
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
rand = "0.8"
hex = "0.4"

# Week 8: Layer 2 live inputs on Windows (TCP connection table, TCP
# retransmit counters, DNS server) via the IP Helper API. Linux reads the
# same facts from /proc and /etc/resolv.conf and needs nothing extra.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

