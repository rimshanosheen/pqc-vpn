# PQC-VPN handshake server.
#
#   cd server && docker compose up -d --build
#
# Host networking is required: the server runs `wg set wg0`, and a kernel
# WireGuard interface is only reachable from the network namespace it lives in
# (the host's). The container therefore shares the host netns but drops every
# capability except CAP_NET_ADMIN.
#
# wg0's lifecycle stays on the host (wg-quick@wg0.service). This container only
# adds / updates peers on it.

services:
  handshake-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: pqc-vpn/handshake-server:latest
    container_name: pqc-handshake-server
    restart: unless-stopped

    network_mode: host

    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp

    volumes:
      # ML-DSA-65 identity seed + derived .pub — must persist (pinned in clients)
      - /var/lib/pqc-vpn:/var/lib/pqc-vpn

    # command is baked into the image (see Dockerfile CMD); override here if a
    # different interface / subnet is needed.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # WireGuard-over-TCP relay (Week 8). Networks that block WireGuard's UDP
  # (seen on eduroam and a mobile hotspot) still pass plain TCP, so clients
  # run `wg-relay client --server <host>:443` and point their WireGuard
  # Endpoint at 127.0.0.1:51820. Forwards ONLY to the local wg0 port.
  wg-relay:
    image: pqc-vpn/handshake-server:latest
    container_name: pqc-wg-relay
    restart: unless-stopped
    depends_on: [handshake-server]
    network_mode: host
    entrypoint: ["/usr/local/bin/wg-relay"]
    command: ["server", "--listen", "0.0.0.0:443", "--forward", "127.0.0.1:51820", "--max-conns", "64"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]   # :443 is a privileged port
    security_opt: ["no-new-privileges:true"]
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
